<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meridian Bank — Assisted Current Account Onboarding</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: {
            50:'#eef4ff',100:'#dbe6ff',200:'#bccfff',300:'#8eabff',
            400:'#597dff',500:'#3354f5',600:'#1f37db',700:'#1a2bb0',
            800:'#1b298c',900:'#1c2870',950:'#141a47'
          },
          ink: '#0f172a'
        },
        fontFamily: { sans: ['Inter','system-ui','sans-serif'] }
      }
    }
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body{font-family:'Inter',system-ui,sans-serif;}
  .fade{animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .spin{animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .pulse{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:8px}
  .sigpad{touch-action:none}
</style>
</head>
<body class="bg-slate-100 text-ink">

<div id="app" class="min-h-screen flex flex-col"></div>

<script>
/* ============================================================
   Meridian Bank — Assisted onboarding + KYB + CA opening
   Front-end-only clickable prototype. Structure inspired by a
   generic assisted-onboarding flow; all visuals are original.
   ============================================================ */

const PHASES = [
  { id:'customer',  label:'Customer Details',   icon:'user' },
  { id:'docs',      label:'Document Collection',icon:'folder' },
  { id:'discipline',label:'Need of Discipline', icon:'shield' },
  { id:'kyc',       label:'KYC Details',        icon:'id' },
  { id:'business',  label:'Business Details',   icon:'building' },
  { id:'fatca',     label:'FATCA & Site Check', icon:'globe' },
  { id:'account',   label:'Account Setup',      icon:'card' },
  { id:'rm',        label:'RM Declaration',     icon:'badge' },
  { id:'post',      label:'Post Onboarding',    icon:'flag' },
];

// Each screen maps to a phase for the sidebar highlight
const SCREENS = [
  {key:'overview',   phase:'customer'},   // 1
  {key:'custForm',   phase:'customer'},   // 2
  {key:'camPerm',    phase:'customer'},   // 3
  {key:'locPerm',    phase:'customer'},   // 4
  {key:'sendLink',   phase:'docs'},       // 5
  {key:'sending',    phase:'docs'},       // 6
  {key:'linkSent',   phase:'docs'},       // 7
  {key:'uploading',  phase:'docs'},       // 8
  {key:'waiting',    phase:'docs'},       // 9
  {key:'docPan',     phase:'docs'},       // 10
  {key:'docList',    phase:'docs'},       // 11
  {key:'docBureau',  phase:'docs'},       // 12
  {key:'discipline', phase:'discipline'}, // 13
  {key:'kycPan',     phase:'kyc'},        // 15
  {key:'kycDigi',    phase:'kyc'},        // 16
  {key:'kycFace',    phase:'kyc'},        // 17
  {key:'kycAddr',    phase:'kyc'},        // 18
  {key:'kycSign',    phase:'kyc'},        // 19
  {key:'selfie',     phase:'kyc'},        // 20
  {key:'bizGst',     phase:'business'},   // 21
  {key:'bizAddr',    phase:'business'},   // 22
  {key:'bizProof',   phase:'business'},   // 23
  {key:'bizMore',    phase:'business'},   // 24
  {key:'fatca',      phase:'fatca'},      // 25
  {key:'sitePhoto',  phase:'fatca'},      // 26
  {key:'siteNamep',  phase:'fatca'},      // 27
  {key:'siteResult', phase:'fatca'},      // 28
  {key:'product',    phase:'account'},    // 29
  {key:'bankStmt',   phase:'account'},    // 30
  {key:'bankDetails',phase:'account'},    // 31
  {key:'rmBasic',    phase:'rm'},         // 32
  {key:'rmSelfie',   phase:'rm'},         // 33
  {key:'postOnb',    phase:'post'},       // 34
  {key:'previewA',   phase:'post'},       // 35
  {key:'previewB',   phase:'post'},       // 36
  {key:'submitted',  phase:'post'},       // 37
];

const state = {
  idx: 0,
  data: {
    customerId:'CA-2000185222',
    name:'Ramesh Raj',
    phone:'+91 76065 12345',
    email:'ramesh@example.com',
    entity:'Sole Proprietorship',
    highExposure:'no',
    channel:'WhatsApp',
    docPhone:'+91 76065 12345',
    pan:'CHTPR0429G',
    panName:'Mukesh Prabhu',
    dob:'20 Oct 1993',
    idMethod:'digilocker',
    address:'709-A, Ellora Cooperative Housing Society, Pune 411001',
    addrProof:'Utility Bill',
    gst:'27ABCDE1234F1Z5',
    gstLegal:'Mukesh Prabhu',
    gstCompany:'Prabhu Enterprises',
    gstAddr:'Shop 14, Market Road, Pune 411002',
    industry:'Retail Trade',
    bizNature:'Trading',
    activity:'B2C Sales',
    turnover:'2 Cr – 5 Cr',
    incorp:'12/06/2018',
    importExport:'no',
    product:'Smart E-Commerce Account',
    rmName:'Rajesh Verma',
    rmId:'RM78923',
    rmChannel:'Field Sales',
    rmDate:'18/06/2026',
    branch:'BR1167',
    ref:'CA-260618-XYZ12345'
  }
};

/* ---------- tiny helpers ---------- */
const $ = (s,el=document)=>el.querySelector(s);
const go  = i => { state.idx = Math.max(0, Math.min(SCREENS.length-1, i)); render(); };
const next= () => go(state.idx+1);
const back= () => go(state.idx-1);
const gotoKey = k => { const i = SCREENS.findIndex(s=>s.key===k); if(i>=0) go(i); };
const gotoPhase = pid => { const i = SCREENS.findIndex(s=>s.phase===pid); if(i>=0) go(i); };
const set = (k,v)=>{ state.data[k]=v; };

const icons = {
  user:'<path d="M12 12a5 5 0 100-10 5 5 0 000 10zm0 2c-5 0-9 2.5-9 6v1h18v-1c0-3.5-4-6-9-6z"/>',
  folder:'<path d="M3 6a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V6z"/>',
  shield:'<path d="M12 2l8 3v6c0 5-3.5 8.5-8 11-4.5-2.5-8-6-8-11V5l8-3z"/>',
  id:'<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2" fill="#fff"/><path d="M14 9h4M14 12h4M6 16h8" stroke="#fff" stroke-width="1.5"/>',
  building:'<path d="M4 21V5a2 2 0 012-2h6a2 2 0 012 2v16M14 9h4a2 2 0 012 2v10M8 7h2M8 11h2M8 15h2"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18" stroke="#fff" stroke-width="1.2" fill="none"/>',
  card:'<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18" stroke="#fff" stroke-width="1.5"/>',
  badge:'<circle cx="12" cy="8" r="4"/><path d="M8 13l-1 8 5-3 5 3-1-8"/>',
  flag:'<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',
  check:'<path d="M20 6L9 17l-5-5" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'
};
const phIcon = (name,cls='w-4 h-4') =>
  `<svg viewBox="0 0 24 24" class="${cls}" fill="currentColor">${icons[name]||icons.check}</svg>`;

/* ---------- chrome: header + sidebar + footer ---------- */
function chrome(inner){
  const cur = SCREENS[state.idx];
  const curPhaseIdx = PHASES.findIndex(p=>p.id===cur.phase);
  const sidebar = PHASES.map((p,i)=>{
    const done = i < curPhaseIdx;
    const active = i === curPhaseIdx;
    const circle = active
      ? `<span class="w-7 h-7 rounded-full bg-brand-600 text-white flex items-center justify-center text-xs font-semibold">${i+1}</span>`
      : done
      ? `<span class="w-7 h-7 rounded-full bg-emerald-500 text-white flex items-center justify-center">${phIcon('check','w-3.5 h-3.5')}</span>`
      : `<span class="w-7 h-7 rounded-full bg-slate-200 text-slate-500 flex items-center justify-center text-xs font-semibold">${i+1}</span>`;
    return `<button onclick="gotoPhase('${p.id}')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-left transition ${active?'bg-brand-50':'hover:bg-slate-50'}">
        ${circle}
        <span class="text-sm ${active?'font-semibold text-brand-800':done?'text-slate-600':'text-slate-400'}">${p.label}</span>
      </button>`;
  }).join('');

  return `
  <header class="bg-white border-b border-slate-200 sticky top-0 z-20">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center text-white font-extrabold">M</div>
        <div>
          <div class="font-bold text-[15px] leading-tight">Meridian Bank</div>
          <div class="text-[11px] text-slate-500 leading-tight">Assisted Current Account Onboarding</div>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <div class="hidden sm:block text-right">
          <div class="text-[11px] text-slate-400">Customer ID</div>
          <div class="text-sm font-semibold">${state.data.customerId}</div>
        </div>
        <div class="text-[11px] text-slate-400">Step ${state.idx+1} / ${SCREENS.length}</div>
      </div>
    </div>
    <div class="h-1 bg-slate-100">
      <div class="h-1 bg-brand-600 transition-all" style="width:${((state.idx+1)/SCREENS.length*100).toFixed(1)}%"></div>
    </div>
  </header>

  <div class="flex-1 max-w-6xl w-full mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-[260px_1fr] gap-6">
    <aside class="hidden lg:block">
      <div class="bg-white rounded-2xl border border-slate-200 p-3 sticky top-24">
        <div class="px-3 pt-1 pb-2 text-[11px] font-semibold uppercase tracking-wide text-slate-400">Journey</div>
        ${sidebar}
      </div>
    </aside>
    <main class="min-w-0">
      <div class="fade">${inner}</div>
    </main>
  </div>

  <footer class="border-t border-slate-200 bg-white">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between text-[11px] text-slate-400">
      <span>Verified by <span class="font-semibold text-slate-500">TrustLayer</span></span>
      <span>Prototype · Front-end only · No real data is stored</span>
    </div>
  </footer>`;
}

/* ---------- reusable UI bits ---------- */
const card = (inner,cls='') => `<div class="bg-white rounded-2xl border border-slate-200 p-6 ${cls}">${inner}</div>`;
const h1 = (t,sub='') => `<div class="mb-5"><h1 class="text-xl font-bold">${t}</h1>${sub?`<p class="text-sm text-slate-500 mt-1">${sub}</p>`:''}</div>`;
const btn = (label,onclick,cls='') => `<button onclick="${onclick}" class="px-5 py-2.5 rounded-xl font-semibold text-sm transition ${cls}">${label}</button>`;
const primary = (label='Continue',onclick='next()') => btn(label,onclick,'bg-brand-600 text-white hover:bg-brand-700');
const ghost = (label='Back',onclick='back()') => btn(label,onclick,'bg-white border border-slate-300 text-slate-600 hover:bg-slate-50');
const navRow = (primaryLabel='Continue',primaryFn='next()') =>
  `<div class="flex items-center justify-between mt-6">${ghost()}${primary(primaryLabel,primaryFn)}</div>`;

const field = (label,key,opts={}) => {
  const v = state.data[key]??'';
  return `<label class="block">
    <span class="text-[13px] font-medium text-slate-600">${label}</span>
    <input value="${v}" ${opts.type?`type="${opts.type}"`:''} placeholder="${opts.ph||''}"
      oninput="set('${key}',this.value)"
      class="mt-1 w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-brand-200 focus:border-brand-500 outline-none"/>
  </label>`;
};
const selectField = (label,key,options) => {
  const v = state.data[key];
  return `<label class="block">
    <span class="text-[13px] font-medium text-slate-600">${label}</span>
    <select onchange="set('${key}',this.value)" class="mt-1 w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm bg-white focus:ring-2 focus:ring-brand-200 focus:border-brand-500 outline-none">
      ${options.map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}
    </select>
  </label>`;
};
const radioRow = (key,options) => {
  const v = state.data[key];
  return `<div class="flex gap-2 flex-wrap">${options.map(o=>{
    const sel = (v===o.val);
    return `<button onclick="set('${key}','${o.val}');render()" class="px-4 py-2 rounded-xl border text-sm font-medium transition ${sel?'border-brand-500 bg-brand-50 text-brand-700':'border-slate-300 text-slate-600 hover:bg-slate-50'}">${o.label}</button>`;
  }).join('')}</div>`;
};
const verifiedBadge = (txt='Verification Completed') =>
  `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-700 text-xs font-semibold">${phIcon('check','w-3 h-3 text-emerald-600')}${txt}</span>`;
const pill = (txt,tone='slate') => {
  const tones={slate:'bg-slate-100 text-slate-600',amber:'bg-amber-100 text-amber-700',emerald:'bg-emerald-100 text-emerald-700',blue:'bg-blue-100 text-blue-700'};
  return `<span class="px-2 py-0.5 rounded-md text-[11px] font-semibold ${tones[tone]}">${txt}</span>`;
};
const docPreview = (label,extra='') =>
  `<div class="aspect-[1.6] rounded-xl border-2 border-dashed border-slate-200 bg-slate-50 flex flex-col items-center justify-center text-slate-400 ${extra}">
      ${phIcon('id','w-10 h-10 text-slate-300')}
      <span class="text-xs mt-1">${label}</span>
   </div>`;
const infoBanner = (txt,tone='amber') => {
  const t = tone==='amber'?'bg-amber-50 border-amber-200 text-amber-800':'bg-blue-50 border-blue-200 text-blue-800';
  return `<div class="rounded-xl border ${t} px-4 py-3 text-sm flex gap-2"><span>ℹ️</span><span>${txt}</span></div>`;
};

/* ============================================================
   SCREENS
   ============================================================ */
const VIEWS = {

/* 1 — Journey overview */
overview(){
  const steps = ['Customer Details','Document Collection','Need of Discipline','KYC Details','Business Details','FATCA & Site Verification','Account Setup','RM Declaration','Post Onboarding'];
  return card(`
    ${h1('Let’s get the current account journey started','A guided, assisted onboarding for your customer — done together, step by step.')}
    <div class="grid sm:grid-cols-2 gap-3">
      ${steps.map((s,i)=>`<div class="flex items-center gap-3 p-3 rounded-xl border border-slate-200">
        <span class="w-8 h-8 rounded-lg bg-brand-50 text-brand-700 font-bold text-sm flex items-center justify-center">${i+1}</span>
        <span class="text-sm font-medium text-slate-700">${s}</span>
      </div>`).join('')}
    </div>
    <div class="flex justify-end mt-6">${primary('Start journey','next()')}</div>
  `);
},

/* 2 — Customer details form */
custForm(){
  return card(`
    ${h1('1 · Customer details','Capture the customer’s basic profile to begin.')}
    <div class="grid sm:grid-cols-2 gap-4">
      ${field('Full name','name')}
      ${field('Phone number','phone')}
      ${field('Email ID','email')}
      ${selectField('Type of entity','entity',['Sole Proprietorship','Partnership','Private Limited','LLP','Public Limited','HUF','Trust'])}
    </div>
    <div class="mt-4">
      <span class="text-[13px] font-medium text-slate-600">Is the entity’s credit exposure greater than ₹5 Cr?</span>
      <div class="mt-2">${radioRow('highExposure',[{val:'no',label:'No'},{val:'yes',label:'Yes'}])}</div>
    </div>
    ${navRow()}
  `);
},

/* 3 — Camera permission */
camPerm(){
  setTimeout(()=>{ if(SCREENS[state.idx].key==='camPerm') next(); }, 2200);
  return card(`
    ${h1('Setup in progress','We’re preparing your device for assisted verification.')}
    <div class="flex items-center gap-3 mb-6">
      <span class="px-3 py-1 rounded-full bg-brand-600 text-white text-xs font-semibold">1 · Camera</span>
      <span class="flex-1 h-0.5 bg-slate-200"></span>
      <span class="px-3 py-1 rounded-full bg-slate-200 text-slate-500 text-xs font-semibold">2 · Location</span>
    </div>
    <div class="flex flex-col items-center justify-center py-10">
      <div class="w-20 h-20 rounded-full border-4 border-brand-100 border-t-brand-600 spin"></div>
      <div class="mt-6 text-lg font-semibold">Checking camera permission…</div>
      <p class="text-sm text-slate-500 mt-1">Allow camera access when prompted to capture documents & selfies.</p>
    </div>
    ${infoBanner('If the browser blocks access, enable the camera from your site settings and retry.')}
    <div class="flex justify-end mt-6">${ghost('Skip','next()')}</div>
  `);
},

/* 4 — Location permission */
locPerm(){
  setTimeout(()=>{ if(SCREENS[state.idx].key==='locPerm') next(); }, 2200);
  return card(`
    ${h1('Setup in progress','Almost there — one more permission.')}
    <div class="flex items-center gap-3 mb-6">
      <span class="px-3 py-1 rounded-full bg-emerald-500 text-white text-xs font-semibold inline-flex items-center gap-1">${phIcon('check','w-3 h-3')} Camera</span>
      <span class="flex-1 h-0.5 bg-emerald-300"></span>
      <span class="px-3 py-1 rounded-full bg-brand-600 text-white text-xs font-semibold">2 · Location</span>
    </div>
    <div class="flex flex-col items-center justify-center py-10">
      <div class="w-20 h-20 rounded-full border-4 border-brand-100 border-t-brand-600 spin"></div>
      <div class="mt-6 text-lg font-semibold">Checking location permission…</div>
      <p class="text-sm text-slate-500 mt-1">Location is used to geo-tag site verification.</p>
    </div>
    ${infoBanner('Location helps confirm the business address during site verification.')}
    <div class="flex justify-end mt-6">${ghost('Skip','next()')}</div>
  `);
},

/* 5 — Send link for document collection */
sendLink(){
  const docs = ['PAN Card','Identity Proof','Business Proof I','Business Proof II','Bureau Check Consent'];
  return card(`
    ${h1('2 · Document collection','Send a secure link so the customer can upload documents from their phone.')}
    <div class="rounded-xl border border-slate-200 divide-y divide-slate-100 mb-5">
      ${docs.map(d=>`<div class="flex items-center justify-between px-4 py-3"><span class="text-sm font-medium text-slate-700">${d}</span>${pill('Required')}</div>`).join('')}
    </div>
    <span class="text-[13px] font-medium text-slate-600">Send link via</span>
    <div class="mt-2 mb-4">${radioRow('channel',[{val:'SMS',label:'SMS'},{val:'WhatsApp',label:'WhatsApp'}])}</div>
    ${field('Customer mobile number','docPhone')}
    <div class="flex items-center justify-between mt-6">
      <button onclick="gotoKey('docPan')" class="text-sm font-semibold text-brand-600 hover:underline">Upload on customer’s behalf instead →</button>
      <div class="flex gap-2">${ghost()}${primary('Send link',"gotoKey('sending')")}</div>
    </div>
  `);
},

/* 6 — Sending */
sending(){
  setTimeout(()=>{ if(SCREENS[state.idx].key==='sending') gotoKey('linkSent'); }, 1600);
  return card(`
    ${h1('2 · Document collection','Sending the secure upload link…')}
    <div class="flex flex-col items-center justify-center py-14">
      <div class="w-16 h-16 rounded-full border-4 border-brand-100 border-t-brand-600 spin"></div>
      <div class="mt-6 font-semibold">Sending link via ${state.data.channel}…</div>
      <p class="text-sm text-slate-500 mt-1">to ${state.data.docPhone}</p>
    </div>
  `);
},

/* 7 — Link sent */
linkSent(){
  setTimeout(()=>{ if(SCREENS[state.idx].key==='linkSent') next(); }, 1800);
  return card(`
    <div class="flex flex-col items-center justify-center py-16 text-center">
      <div class="w-20 h-20 rounded-full bg-emerald-500 flex items-center justify-center">${phIcon('check','w-10 h-10')}</div>
      <h1 class="text-xl font-bold mt-6">Link sent successfully</h1>
      <p class="text-sm text-slate-500 mt-1">We’ve notified ${state.data.name} on ${state.data.channel}. Taking you to the tracker…</p>
    </div>
  `);
},

/* 8 — Customer still uploading */
uploading(){
  return card(`
    ${h1('2 · Document collection','Customer is still uploading.')}
    <div class="flex flex-col items-center py-6">
      <div class="relative">
        ${phIcon('folder','w-24 h-24 text-brand-200')}
        <span class="absolute -top-2 -right-2 bg-brand-600 text-white text-xs font-semibold px-2 py-0.5 rounded-full">2 captured</span>
      </div>
      <div class="mt-4 font-semibold">Waiting on the customer to finish</div>
      <p class="text-sm text-slate-500">Link sent 5 mins ago</p>
    </div>
    ${infoBanner('If the customer is stuck, call them and walk through capturing each document in good lighting.')}
    <div class="flex items-center justify-between mt-6">${ghost()}${primary('Refresh status','next()')}</div>
  `);
},

/* 9 — Waiting for customer */
waiting(){
  return card(`
    ${h1('2 · Document collection','Waiting for the customer’s response.')}
    <div class="flex flex-col items-center py-6">
      <div class="relative">
        ${phIcon('folder','w-24 h-24 text-brand-200 pulse')}
        <span class="absolute -top-2 -right-2 bg-emerald-500 text-white text-xs font-semibold px-2 py-0.5 rounded-full">3 captured</span>
      </div>
      <div class="mt-4 font-semibold">Documents are coming in…</div>
      <p class="text-sm text-slate-500">Uploads usually complete within a few minutes.</p>
    </div>
    <div class="flex items-center justify-between mt-6">${ghost()}${primary('View received documents','next()')}</div>
  `);
},

/* 10 — Received PAN */
docPan(){
  return card(`
    ${h1('2 · Document collection','You’ve received 3 / 5 documents from the customer.')}
    <div class="rounded-2xl border border-slate-200 p-4">
      <div class="flex items-center justify-between mb-3">
        <span class="font-semibold">PAN Card</span>
        ${verifiedBadge('Uploaded')}
      </div>
      ${docPreview('PAN scan preview')}
      <div class="flex gap-2 mt-3 flex-wrap">${pill('Original','emerald')}${pill('Not Tampered','emerald')}${pill('Quality OK','emerald')}</div>
      <div class="grid grid-cols-3 gap-3 mt-4 text-sm">

/* ---------- signature canvas ---------- */
let sigCtx=null;
function initSig(){
  const c = $('#sig'); if(!c) return;
  sigCtx = c.getContext('2d');
  sigCtx.lineWidth=2.5; sigCtx.lineCap='round'; sigCtx.strokeStyle='#1f2937';
  let drawing=false;
  const pos=e=>{const r=c.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:(t.clientX-r.left)*(c.width/r.width),y:(t.clientY-r.top)*(c.height/r.height)};};
  const start=e=>{drawing=true;const p=pos(e);sigCtx.beginPath();sigCtx.moveTo(p.x,p.y);e.preventDefault();};
  const move=e=>{if(!drawing)return;const p=pos(e);sigCtx.lineTo(p.x,p.y);sigCtx.stroke();e.preventDefault();};
  const end=()=>drawing=false;
  c.addEventListener('mousedown',start);c.addEventListener('mousemove',move);window.addEventListener('mouseup',end);
  c.addEventListener('touchstart',start);c.addEventListener('touchmove',move);c.addEventListener('touchend',end);
}
function clearSig(){ if(sigCtx){const c=$('#sig');sigCtx.clearRect(0,0,c.width,c.height);} }

/* ---------- master render ---------- */
function render(){
  const cur = SCREENS[state.idx];
  let body;
  if(cur.key==='bankStmt'){ body = renderBankStmtModal(); }
  else { body = VIEWS[cur.key](); }
  $('#app').innerHTML = chrome(body);
  if(cur.key==='kycSign') initSig();
  window.scrollTo({top:0,behavior:'smooth'});
}

render();
